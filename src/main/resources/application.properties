spring.application.name=territory-predictive-insights

# ==========================================
# H2 em ARQUIVO (os dados sobrevivem ao reiniciar o programa)
# O arquivo e criado em ./data/tpi.mv.db na primeira execucao
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/tpi
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: cria/atualiza as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
